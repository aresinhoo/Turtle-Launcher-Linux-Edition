name: Build Linux Binary

on:
  push:
    tags:
      - 'v*'          # runs when you push a tag like v1.2.0
  workflow_dispatch:   # lets you trigger it manually from the Actions tab

jobs:
  build-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller customtkinter pillow
          # if you have a requirements.txt, use this instead:
          # pip install -r requirements.txt

      - name: Build with PyInstaller
        run: |
          python -m PyInstaller --onefile --windowed --collect-all customtkinter launcher.py

      - name: Rename binary
        run: mv dist/launcher dist/TurtleLauncher-linux

      - name: Make executable
        run: chmod +x dist/TurtleLauncher-linux

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/TurtleLauncher-linux
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}